<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="holders CORE">
  <title>holders CORE</title>
  <!-- The four stages: proposed, approved, delivered, used. The fourth is
       drawn faint because for a large share of the record nobody wrote it
       down. Monochrome mid-grey so the mark holds on a light or dark tab. -->
  <g fill="#6e6e73">
    <rect x="4" y="4"  width="24" height="4" rx="2"/>
    <rect x="4" y="11" width="24" height="4" rx="2"/>
    <rect x="4" y="18" width="24" height="4" rx="2"/>
    <rect x="4" y="25" width="24" height="4" rx="2" opacity=".25"/>
  </g>
</svg>
